[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "android-humanizer"
version = "0.3.0"
description = "Human-like touch trajectory, timing and sensor simulation for Android automation."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "android-humanizer contributors"}]
keywords = ["android", "automation", "humanization", "bezier", "fitts", "sensor"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
android-humanizer-web = "android_humanizer.web.server:main"

[tool.setuptools.packages.find]
include = ["android_humanizer*"]

[tool.setuptools.package-data]
"android_humanizer.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
