kinematics:
  enabled: true
  steps_min: 20
  steps_max: 60
  px_per_step: 15
  duration_per_px: 0.0007
  duration_min: 0.3
  duration_max: 1.5
  perpendicular_ratio: 0.12
  use_ease_in_out: true
  jitter_sigma: 1.2
  jitter_tail_fraction: 0.25
  overshoot_prob: 0.25
  overshoot_ratio: 0.06

timing:
  mu_ratio: 0.18
  sigma_range: [0.45, 0.75]
  delay_between_actions: [0.6, 2.2]
  delay_after_open: [3.0, 6.0]
  think_delay: [1.5, 4.0]
  start_jitter: [0, 600]
  wake_window: {start: "07:30", end: "23:00"}
  cooldown_every: 12
  cooldown_seconds: 20
  cooldown_on_captcha: 300

sensors:
  fs: 100.0
  duration: 5.0
  mode: resting
  dead_std_threshold: 0.02
  gyro_dead_std: 0.001
  dead_zero_ratio_max: 0.9
