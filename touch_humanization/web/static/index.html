<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>touch-humanization · 全功能预览</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <h1>touch-humanization</h1>
    <p class="muted">拟人化手势 · 时序 · 传感器 —— 交互式预览（零第三方依赖）</p>
  </header>

  <nav class="tabs">
    <button data-tab="kinematics" class="on">手势轨迹</button>
    <button data-tab="timing">时序</button>
    <button data-tab="sensors">传感器</button>
  </nav>

  <!-- ===================== 手势轨迹 ===================== -->
  <section id="tab-kinematics" class="tab on">
    <div class="form">
      <label>起点 x<input id="kx0" type="number" value="100"></label>
      <label>起点 y<input id="ky0" type="number" value="1800"></label>
      <label>终点 x<input id="kx1" type="number" value="900"></label>
      <label>终点 y<input id="ky1" type="number" value="400"></label>
      <label>seed<input id="kseed" type="number" placeholder="留空=随机"></label>
      <label class="chk"><input id="kslider" type="checkbox"> 滑块模式</label>
      <label class="chk"><input id="kexact" type="checkbox" checked> 终点精确</label>
      <button id="kgo">Generate</button>
    </div>

    <details class="advanced">
      <summary>高级参数（与 Python Kinematics 对齐）</summary>
      <div class="form">
        <label>steps_min<input id="k_steps_min" type="number" value="20"></label>
        <label>steps_max<input id="k_steps_max" type="number" value="60"></label>
        <label>px_per_step<input id="k_px_per_step" type="number" step="0.5" value="15"></label>
        <label>duration_per_px<input id="k_duration_per_px" type="number" step="0.0001" value="0.0007"></label>
        <label>duration_min<input id="k_duration_min" type="number" step="0.05" value="0.3"></label>
        <label>duration_max<input id="k_duration_max" type="number" step="0.05" value="1.5"></label>
        <label>perpendicular_ratio<input id="k_perp" type="number" step="0.01" value="0.12"></label>
        <label>jitter_sigma<input id="k_jitter" type="number" step="0.1" value="1.2"></label>
        <label>jitter_tail_fraction<input id="k_jtail" type="number" step="0.05" value="0.25"></label>
        <label>overshoot_prob<input id="k_overshoot" type="number" step="0.05" value="0.25"></label>
        <label>overshoot_ratio<input id="k_oratio" type="number" step="0.01" value="0.06"></label>
        <label class="chk"><input id="k_ease" type="checkbox" checked> ease-in-out</label>
      </div>
    </details>

    <div class="row">
      <canvas id="cv-kinematics" width="1000" height="720"></canvas>
      <aside class="meta">
        <div id="kmeta"></div>
        <button id="kplay" class="small">播放动画</button>
        <div id="kplay-status" class="muted"></div>
      </aside>
    </div>
  </section>

  <!-- ===================== 时序 ===================== -->
  <section id="tab-timing" class="tab">
    <h2>延迟分布</h2>
    <div class="form">
      <label>采样数 n<input id="t_n" type="number" value="3000"></label>
      <label>lo<input id="t_lo" type="number" step="0.1" value="0.6"></label>
      <label>hi<input id="t_hi" type="number" step="0.1" value="2.2"></label>
      <label>seed<input id="t_seed" type="number" placeholder="留空=随机"></label>
      <label class="chk"><input id="t_ln" type="checkbox" checked> 对数正态</label>
      <button id="tgo">采样</button>
    </div>
    <div class="row">
      <canvas id="cv-timing" width="1000" height="360"></canvas>
      <aside class="meta"><div id="tmeta"></div></aside>
    </div>

    <h2>作息窗口</h2>
    <div class="form">
      <label>start<input id="w_start" value="07:30"></label>
      <label>end<input id="w_end" value="23:00"></label>
      <button id="wgo">计算</button>
    </div>
    <canvas id="cv-window" width="1000" height="120"></canvas>
    <div id="wmeta" class="meta"></div>

    <h2>冷却模拟</h2>
    <div class="form">
      <label>点击次数<input id="c_n" type="number" value="40"></label>
      <label>cooldown_every<input id="c_every" type="number" value="12"></label>
      <label>cooldown_seconds<input id="c_seconds" type="number" step="0.5" value="20"></label>
      <label>seed<input id="c_seed" type="number" placeholder="留空=随机"></label>
      <button id="cgo">模拟</button>
    </div>
    <div id="cresult"></div>
  </section>

  <!-- ===================== 传感器 ===================== -->
  <section id="tab-sensors" class="tab">
    <div class="form">
      <label>模式
        <select id="s_mode">
          <option value="resting">resting</option>
          <option value="walking">walking</option>
          <option value="tapping">tapping</option>
          <option value="scrolling">scrolling</option>
        </select>
      </label>
      <label>fs<input id="s_fs" type="number" step="10" value="100"></label>
      <label>duration(s)<input id="s_duration" type="number" step="0.5" value="3"></label>
      <label>seed<input id="s_seed" type="number" placeholder="留空=随机"></label>
      <button id="sgo">Generate</button>
      <button id="scsv">下载 CSV</button>
    </div>
    <canvas id="cv-sensors" width="1000" height="480"></canvas>
    <aside class="meta"><div id="smeta"></div></aside>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
