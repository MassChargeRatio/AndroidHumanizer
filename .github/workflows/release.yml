name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build sdist/wheel + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel contents
        run: |
          python -c "import glob,zipfile,sys; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); need=['android_humanizer/web/static/index.html','android_humanizer/web/static/app.js','android_humanizer/web/static/style.css']; miss=[x for x in need if x not in n]; print('static OK') if not miss else sys.exit('missing %s' % miss)"

      # Portable zip: pip install -t into a folder + launcher scripts.
      # Unzip and run; requires a system Python 3.9+ (project is stdlib-only).
      # NOTE: a single-file zipapp does NOT work here — server.py opens
      # static files with plain open(), which cannot read inside a zip.
      # 便携 zip：pip install -t 到目录 + 启动脚本。解压即用，需系统 Python 3.9+
      # （本项目纯标准库）。注意：单文件 zipapp 不可行——server.py 用普通
      # open() 读静态文件，无法读取 zip 内部资源。
      - name: Build portable zip
        run: |
          V=$(python -c "import tomllib,glob; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python -m pip install --quiet dist/*.whl -t _portable/android-humanizer
          printf '#!/bin/sh\ncd "$(dirname "$0")"\nexec python3 -m android_humanizer.web.server "$@"\n' > _portable/android-humanizer/run-web-ui.sh
          printf '@echo off\r\ncd /d %%~dp0\r\npython -m android_humanizer.web.server %%*\r\n' > _portable/android-humanizer/run-web-ui.bat
          chmod +x _portable/android-humanizer/run-web-ui.sh
          find _portable -name '__pycache__' -type d -exec rm -rf {} + || true
          cd _portable && zip -qr "../dist/android-humanizer-portable-$V.zip" android-humanizer && cd ..

      - name: Smoke test portable zip
        run: |
          V=$(python -c "import tomllib,glob; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          unzip -q "dist/android-humanizer-portable-$V.zip" -d _smoke
          ok=0
          _smoke/android-humanizer/run-web-ui.sh --port 8901 --no-browser & SRV=$!
          for i in 1 2 3 4 5; do
            sleep 1
            if curl -sf http://127.0.0.1:8901/api/health > /dev/null; then ok=1; break; fi
          done
          kill $SRV 2>/dev/null || true
          [ "$ok" = "1" ] || { echo "portable zip smoke FAILED"; exit 1; }
          echo "portable zip smoke OK"

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
