name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q
      - name: Lint random usage
        run: python tools/lint_random.py

  package:
    name: package (wheel + static assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Assert static assets in wheel
        run: |
          python -c "import glob,zipfile,sys; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); need=['touch_humanization/web/static/index.html','touch_humanization/web/static/app.js','touch_humanization/web/static/style.css']; miss=[x for x in need if x not in n]; print('static assets OK:', len(need)) if not miss else sys.exit('missing: %s' % miss)"
      - name: Smoke install from wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import os, touch_humanization as t; from touch_humanization.web.server import STATIC_DIR; assert os.path.isfile(os.path.join(STATIC_DIR, 'index.html')), STATIC_DIR; g=t.Humanizer(seed=1).gesture((0,0),(100,100)); print('version', t.__version__, 'steps', g.steps)"
